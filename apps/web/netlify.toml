[build]
  base = "apps/web"
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/"
  to = "/et/"
  status = 301
  force = true

# Subcategory redirects (flattened to single performances list)
[[redirects]]
  from = "/et/etendused/suurtele/*"
  to = "/et/etendused/:splat"
  status = 301

[[redirects]]
  from = "/et/etendused/noorele-publikule/*"
  to = "/et/etendused/:splat"
  status = 301

[[redirects]]
  from = "/en/performances/for-adults/*"
  to = "/en/performances/:splat"
  status = 301

[[redirects]]
  from = "/en/performances/for-young-audiences/*"
  to = "/en/performances/:splat"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
